spring:
  application:
    name: ai-builder-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_builder
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.1-flash-lite
          temperature: 0.2
          max-output-tokens: 8192

    tools:
      limits:
        max-calls-per-tool-default: 3
        max-total-tool-calls: 8
        on-limit-exceeded: RETURN_ERROR_RESPONSE

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
