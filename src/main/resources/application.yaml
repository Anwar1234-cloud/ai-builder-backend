spring:
  application:
    name: ai-builder-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_builder
    username: postgres
    password:  12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model:  gemini-3.5-flash-lite
          temperature: 0.2
          max-output-tokens: 8192

    tools:
      limits:
        max-calls-per-tool-default: 10
        max-total-tool-calls: 30
        on-limit-exceeded: RETURN_ERROR_RESPONSE

    retry:
      max-attempts: 3
      backoff:
        initial-interval: 35000ms
        multiplier: 2
        max-interval: 120000ms
      on-http-codes:
        - 429
        - 503

server:
  port: 8080

jwt:
  secret: ai-builder-development-secret-key-change-before-production-2026
  expiration: 86400000
